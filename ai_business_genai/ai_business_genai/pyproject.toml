[project]
name = "ai-business-genai-assistant"
version = "0.2.0"
description = "Streamlit app that cleans messy Excel/CSV files and analyses them with Gemini (validated reports + safe tool calling)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy",
    "openpyxl",
    "plotly",
    "pydantic>=2.5",
    "google-genai>=1.0",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
